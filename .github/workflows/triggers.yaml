name: Triggers de Workflow

on:
  workflow_dispatch: # Disparo manual de workflow
    inputs:
      exemplo-input:
        type: string
        description: Teste de input de valor
        required: true
        default: "teste"
      deploy:
        type: boolean
        default: true
      

  # push: # Sempre que fizermos push / commit para o repositório remoto
  #   branches: ["main", feature/*, release/] # nas branchs especificadas. 
  #   tags: # Especificando exigência de tags
  #     -v*
  #   paths: # Especifica que só irá disparar se houver alteração nos caminhos especificados
  #     - "src/*"
  #   branches-ignore: 
  #   tags-ignore:
  #   paths-ignore:
  
  # pull_request: # Quando houver uma solicitação de pull request 
  #   branches: ["main"] # Nas branchs especificadas
  #   types: opened

  # schedule: # Programando a execução do workflow em um periodo especificado, de forma agendada
  #   - cron: "*/5 * * * *"
jobs: 
  teste: 
    runs-on: ubuntu-latest
    steps:
      # - name: Action de Teste Workflow Dispatch
      #   run: echo "${{ inputs.exemplo-input }}"
      # - name: Action disparada pelo Push
      #   run: echo "Evento rodou pelo push"
      # - name: Action disparada pelo Pull Request
      #   run: echo "Testes de validação do Pull Request"
      - name: Operação com String
        run: echo "${{ github.actor  == inputs.exemplo_input }}"